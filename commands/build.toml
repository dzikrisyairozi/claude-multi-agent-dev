description = "Implement tasks incrementally — build, test, verify, commit. Add \"auto\" to run the whole plan in one approved pass."

prompt = """
Invoke the agent-skills:incremental-implementation skill alongside agent-skills:test-driven-development.

## Modes

- **`/build`** — implement the *next* pending task, then stop (careful, one slice at a time).
- **`/build auto`** — generate the plan if needed, get a single approval, then implement *every* task without stopping between them.

`$ARGUMENTS` selects the mode. Treat `auto` (canonical) or `all` as autonomous mode; anything else (or empty) is the default single-task mode. Note: autonomous mode is not faster *per task* — it runs the same test-driven loop — it only removes the human stepping *between* tasks.

## Branch safety (before every commit)

Never commit directly to `master`, `main`, or `develop`. Before the *first* commit of a `/build` run (and cheaply re-check before any later commit too — it's a no-op once you're already off the mainline branch):

1. Check the current branch: `git branch --show-current`.
2. If it is `master`, `main`, or `develop`: create a new branch and switch to it *before* committing anything — `git checkout -b <type>/<slug>`. Derive `<type>` from the nature of the work (`feat`, `fix`, `chore`, …) and `<slug>` from the task/feature being built (reuse the plan's feature slug from `tasks/<feature-name>/` when one exists, kebab-case otherwise). Every commit in this run then lands on that branch.
3. If already on any other branch, treat it as the intended working branch and commit there — no new branch needed.
4. **Do not push and do not open a pull request automatically.** A new local branch + local commits are safe and reversible; pushing and opening a PR touch shared state and require the user's explicit go-ahead. Note in the final summary that the work landed on a new local branch, and that pushing / opening a PR is available on request.

## Default: one task

Pick the next pending task from the plan. Then:

1. Read the task's acceptance criteria
2. Load relevant context (existing code, patterns, types) — prefer serena's `get_symbols_overview`/`find_symbol` over reading whole files
3. Write a failing test for the expected behavior (RED)
4. Implement the minimum code to pass the test (GREEN) — for a change scoped to one symbol, prefer serena's `replace_symbol_body`/`insert_after_symbol`/`insert_before_symbol` over a full-file edit
5. Run the full test suite to check for regressions
6. Run the build to verify compilation
7. Apply **Branch safety** above, then commit with a descriptive message
8. Mark the task complete and stop
9. If that was the **final** pending task, run the **Comprehension gate** (below) before treating the work as ready to hand off, and mention `/review` (optionally chained with `/ponytail-review` for an over-engineering pass) as the next step.

## Autonomous: the whole plan (`/build auto`)

Use this once a spec exists and you want to collapse plan + build into one run. It removes the manual stepping between tasks — **not** the verification. Every task still earns a passing test and its own commit.

1. **Require a spec.** Look only for a spec at a known path: `spec/<feature-name>/spec.md`, `SPEC.md` at the repo root, or `docs/SPEC.md` (legacy locations, still recognized). A README or arbitrary doc does **not** count. If none exists, stop and tell the user to run `/spec` first — do not invent requirements.
2. **Establish a clean baseline.** Run `git status --porcelain`. If there are uncommitted changes outside the expected planning artifacts (`SPEC.md`, `docs/SPEC.md`, `spec/*`, `tasks/*`), stop and ask the user to commit, stash, or confirm how to handle them. Autonomous per-task commits must not absorb unrelated local work, or the clean-rollback guarantee breaks.
3. **Apply Branch safety** (above) — off the mainline branch before anything gets committed.
4. **Plan if needed.** If there is no `tasks/<feature-name>/plan.md` for the spec's feature slug, invoke agent-skills:planning-and-task-breakdown to generate one.
5. **Single checkpoint.** Present the full plan and wait for an unambiguous affirmative (e.g. "approve", "go", "yes"). Treat hedged responses ("looks reasonable", "I guess") as **not** approved. This is the only human gate — after approval, run autonomously. If you generated `tasks/<feature-name>/plan.md`, commit it as a single preparatory commit now so it doesn't bleed into the first task's commit.
6. **Execute every task in dependency order.** Use each task's declared dependencies; if they aren't explicit, execute in the order the plan lists them. For each task, run the full default loop above (RED → GREEN → regression → build → commit → mark complete). Stage only the files that task touched plus its task-status update — never `git add -A` blindly — and make one commit per task so any point is a clean rollback.
7. **Stop and ask the user** (do not push through) when:
   - a test can't be made to pass or the build breaks without an obvious fix → follow agent-skills:debugging-and-error-recovery
   - the spec is ambiguous, or a task needs a decision the spec doesn't cover
   - a task is high-risk or irreversible — auth/permission changes, destructive data migrations, payments, deletions, deploys, anything touching secrets, **or anything you can't undo with `git revert`** → follow agent-skills:doubt-driven-development and get explicit sign-off before continuing

   After the user resolves a blocker, they re-invoke `/build auto` — it resumes from the next pending task.
8. **Run the Comprehension gate** (below) once at the very end, before the final summary.
9. **Summarize at the end:** tasks completed, tests added, commits made, which branch they landed on, and anything skipped, flagged, or left for the user. Mention `/review` (plus `/ponytail-review` for an over-engineering pass) as the next step.

## Comprehension gate (before hand-off)

Cognitive debt is manufactured here — the agent wrote code you now own. Before this work is cleared to leave your hands (push, PR, or "ready for team review"), run the gate:

- **Trigger:** the last pending task is complete, or you signal you're wrapping up to hand off. In `/build auto`, run it once at the very end. Per-slice local commits are **not** gated — the gate blocks *hand-off*, not local progress.
- **Run the `/quiz` protocol** against the code written this session: 5 medium questions, one at a time, grounded in the real diff, no answers revealed until you respond.
- **PASS (4/5, no miss on core logic)** → work is cleared to hand off. Pushing is still your call.
- **FAIL** → work is **not** cleared. I'll point you to the exact `file:line` to reread, offer to walk through it, then re-quiz. I will not push, open a PR, or mark it ready-for-review until you pass.

Hard rule: code you can't explain does not reach teammates.

If any step fails, follow the agent-skills:debugging-and-error-recovery skill.
"""
